<title>Analog Finder Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one dark "blackboard" stage per beat, a plain-language caption under it,
   chapter chips above. Dark-first, because the animation is the page. */
:root {
  color-scheme: dark;
  --bg: #0e1116; --panel: #161b22; --line: #2b3440; --ink: #eef1f5; --mute: #9aa6b4;
  --earth: #3987e5; --moon: #199e70; --mars: #d95926; --hi: #f2c200;
  --good: #2fb344; --bad: #e5534b; --stage: #0a0d12;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --line: #d5dbe3; --ink: #101418; --mute: #55606e;
  --earth: #2a78d6; --moon: #128a60; --mars: #d95926; --hi: #b98900;
  --good: #1a8f2f; --bad: #c9362f; --stage: #ffffff;
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f7f9; --panel: #ffffff; --line: #d5dbe3; --ink: #101418; --mute: #55606e;
  --earth: #2a78d6; --moon: #128a60; --mars: #d95926; --hi: #b98900;
  --good: #1a8f2f; --bad: #c9362f; --stage: #ffffff;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5; }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 2px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--mute); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(22px, 3.4vw, 32px); line-height: 1.15; text-wrap: balance; }
.chapters { display: flex; flex-wrap: wrap; gap: 6px; }
.chapters button { font: 500 12.5px var(--body); color: var(--mute); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.chapters button[aria-current="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.chapters button:hover { color: var(--ink); }
.chapters button[aria-current="true"]:hover { color: var(--bg); }
.stage { position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  aspect-ratio: 16 / 9; max-width: 100%; }
@media (max-width: 560px) { .stage { aspect-ratio: 4 / 5; } }
canvas { display: block; width: 100%; height: 100%; }
.tag { position: absolute; right: 10px; top: 10px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line); }
.bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--hi); width: 0; }
.caption { display: flex; flex-direction: column; gap: 4px; min-height: 8.5em; }
.kicker { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--hi); font-weight: 600; }
h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(19px, 2.6vw, 25px); line-height: 1.2; text-wrap: balance; }
.caption p.body { margin: 0; max-width: 68ch; color: var(--ink); font-size: 15.5px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.controls button { font: 600 14px var(--body); border-radius: 8px; padding: 9px 16px; cursor: pointer;
  color: var(--ink); background: var(--panel); border: 1px solid var(--line); }
.controls button.primary { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.controls button:disabled { opacity: .4; cursor: default; }
.controls .count { margin-left: auto; color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
button:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.hint { margin: 0; color: var(--mute); font-size: 12.5px; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Terrestrial Analog Finder · NASA Space Apps 2026</p>
    <h1>How we find Earth's closest match to a place on the Moon or Mars</h1>
  </header>
  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  <div class="stage">
    <canvas id="cv" role="img" aria-label="Animated diagram for the current step"></canvas>
    <div class="tag" id="tag" hidden></div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="caption" aria-live="polite">
    <p class="kicker" id="kicker"></p>
    <h2 id="ctitle"></h2>
    <p class="body" id="ctext"></p>
  </div>
  <div class="controls">
    <button id="prev" type="button">Back</button>
    <button id="replay" type="button">Replay</button>
    <button id="next" type="button" class="primary">Next</button>
    <span class="count" id="count"></span>
  </div>
  <p class="hint">Arrow keys or space also move between beats. Scenes marked "illustration" use invented numbers; every other number is read from the project's data.</p>
</div>

<script src="data.js"></script>
<script src="scenes.js"></script>
<script>
(function () {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const el = id => document.getElementById(id);
  let W = 0, H = 0, dpr = 1, idx = 0, t0 = 0, C = {};
  // "#still" shows every beat finished, with no motion (also used for people who prefer reduced motion)
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches || location.hash === "#still";

  function tokens() {
    const s = getComputedStyle(document.documentElement);
    const g = n => s.getPropertyValue(n).trim();
    C = { bg: g("--stage"), ink: g("--ink"), mute: g("--mute"), line: g("--line"), panel: g("--panel"),
          earth: g("--earth"), moon: g("--moon"), mars: g("--mars"), hi: g("--hi"), good: g("--good"), bad: g("--bad") };
  }
  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const G = {
    get W() { return W; }, get H() { return H; }, get C() { return C; }, ctx,
    X: u => u * W, Y: v => v * H, S: k => k * Math.min(W, H),
    get narrow() { return W < 520; },
    fs: k => clamp(W / 62, 10.5, 16.5) * k,
    clamp, ease, lerp: (a, b, t) => a + (b - a) * t,
    seg: (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1)),
    lin: (t, a, b) => clamp((t - a) / (b - a), 0, 1),
    rnd: i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); },
    text(str, x, y, o = {}) {
      ctx.save();
      ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
      ctx.font = `${o.weight || 500} ${G.fs(o.size || 1)}px ${o.display ? '"Space Grotesk", ' : ""}"Inter", system-ui, sans-serif`;
      ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || "left"; ctx.textBaseline = o.base || "middle";
      ctx.fillText(str, x, y); ctx.restore();
    },
    line(x1, y1, x2, y2, o = {}) {
      ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha; ctx.strokeStyle = o.color || C.ink;
      ctx.lineWidth = o.w || 1.5; if (o.dash) ctx.setLineDash(o.dash); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
    },
    dot(x, y, r, color, alpha) {
      ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); ctx.restore();
    },
    ring(x, y, r, color, w, alpha) {
      ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.strokeStyle = color; ctx.lineWidth = w || 1.5;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); ctx.restore();
    },
    rect(x, y, w, h, o = {}) {
      ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
      const r = Math.min(o.r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
      if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
      if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.w || 1.5; ctx.stroke(); }
      ctx.restore();
    },
    poly(pts, o = {}) {
      ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha; ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      if (o.close) ctx.closePath();
      if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
      if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.w || 1.5; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke(); }
      ctx.restore();
    },
    arrow(x1, y1, x2, y2, o = {}) {
      G.line(x1, y1, x2, y2, o);
      const a = Math.atan2(y2 - y1, x2 - x1), s = o.head || 7;
      G.poly([[x2, y2], [x2 - s * Math.cos(a - .45), y2 - s * Math.sin(a - .45)], [x2 - s * Math.cos(a + .45), y2 - s * Math.sin(a + .45)]],
        { fill: o.color || C.ink, close: true, alpha: o.alpha });
    },
    ramp(v, stops) {
      v = clamp(v, 0, 1);
      for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
        const a = stops[i - 1], b = stops[i], f = (v - a[0]) / (b[0] - a[0] || 1);
        return `rgb(${[0, 1, 2].map(k => Math.round(a[1][k] + (b[1][k] - a[1][k]) * f)).join(",")})`;
      }
      return `rgb(${stops[stops.length - 1][1].join(",")})`;
    }
  };

  const chapters = [];
  STEPS.forEach((s, i) => { if (!chapters.length || chapters[chapters.length - 1].name !== s.ch) chapters.push({ name: s.ch, first: i }); });
  const nav = el("chapters");
  chapters.forEach((c, k) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = c.name; b.id = "chap-" + k;
    b.addEventListener("click", () => go(c.first)); nav.appendChild(b);
  });

  function go(i) {
    idx = clamp(i, 0, STEPS.length - 1); t0 = performance.now();
    const s = STEPS[idx];
    el("kicker").textContent = s.ch; el("ctitle").textContent = s.title; el("ctext").textContent = s.text;
    el("count").textContent = (idx + 1) + " / " + STEPS.length;
    el("prev").disabled = idx === 0; el("next").disabled = idx === STEPS.length - 1;
    const tag = el("tag"); tag.hidden = !s.note; tag.textContent = s.note || "";
    chapters.forEach((c, k) => el("chap-" + k).setAttribute("aria-current", String(c.name === s.ch)));
    try { localStorage.setItem("afx-step", String(idx)); } catch (e) {}
  }
  function frame(now) {
    const s = STEPS[idx];
    const t = reduced ? 1 : clamp((now - t0) / s.dur, 0, 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    G.note = !!s.note;
    try { s.draw(G, t); } catch (e) { G.text("This beat could not be drawn: " + e.message, 16, 24, { color: C.bad }); }
    el("bar").style.width = (t * 100) + "%";
    requestAnimationFrame(frame);
  }
  el("next").addEventListener("click", () => go(idx + 1));
  el("prev").addEventListener("click", () => go(idx - 1));
  el("replay").addEventListener("click", () => go(idx));
  document.addEventListener("keydown", e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
    else if (e.key === "r" || e.key === "R") go(idx);
  });
  window.addEventListener("resize", resize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", tokens);
  new MutationObserver(tokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  let start = 0;
  try { start = parseInt(localStorage.getItem("afx-step") || "0", 10) || 0; } catch (e) {}
  tokens(); resize(); go(start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { tokens(); });
  requestAnimationFrame(frame);
})();
</script>
